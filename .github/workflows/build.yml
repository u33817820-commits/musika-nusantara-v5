name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm install
      - run: npm run build
        env:
          VITE_KIE_API_KEY: ${{ secrets.VITE_KIE_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: musika-v5-dist
          path: dist
